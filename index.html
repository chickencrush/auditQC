<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c7192d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="CC QC"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/icon-192.png"><title>Chicken Crush QC</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020;font-family:Inter,system-ui,Arial}.top{height:36px;background:#0b1020;color:#dbe3f3;display:flex;align-items:center;padding:0 12px;gap:8px;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#38c172}.dot.off{background:#ef4444}.ver{margin-left:auto;opacity:.6}#main{position:fixed;left:0;right:0;top:36px;bottom:0;width:100%;height:auto;min-height:0;overflow:hidden;background:#0b1020}.frame{display:block;border:0;width:100%;height:100%;min-height:100%;background:white}.setup{width:100%;height:100%;display:grid;place-items:center;color:white;padding:24px}.card{max-width:620px;background:#151c30;border:1px solid #2a3550;border-radius:18px;padding:26px;box-shadow:0 20px 60px #0006}.card code{display:block;background:#090d18;padding:12px;border-radius:10px;overflow-wrap:anywhere;color:#ffd0d5}.card b{color:#ff6b7a}
</style></head><body><div class="top"><span id="dot" class="dot"></span><span id="net">Online</span><span>Chicken Crush QC • GitHub PWA</span><span class="ver" id="ver"></span></div><main id="main"></main><script src="config.js"></script><script>
const cfg=window.CCQC_CONFIG||{}; document.getElementById('ver').textContent='V'+(cfg.APP_VERSION||'3.0.1');
function net(){const on=navigator.onLine;document.getElementById('dot').className='dot'+(on?'':' off');document.getElementById('net').textContent=on?'Online':'Offline'} addEventListener('online',net);addEventListener('offline',net);net();
const main=document.getElementById('main');
if(!cfg.APP_URL||cfg.APP_URL.includes('PASTE_')){main.className='setup';main.innerHTML='<div class="card"><h2>Setup V3.0 belum selesai</h2><p>Buka <b>config.js</b> di repository GitHub lalu isi <code>APP_URL</code> dengan URL deployment Google Apps Script yang berakhiran <b>/exec</b>.</p><p>Setelah commit, refresh aplikasi. Database Google Sheet dan Drive tetap menggunakan backend lama.</p></div>'}else{const f=document.createElement('iframe');f.className='frame';f.allow='camera; microphone; clipboard-read; clipboard-write';f.referrerPolicy='no-referrer-when-downgrade';f.src=cfg.APP_URL;main.appendChild(f)}
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
let deferred;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;});window.installCCQC=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null}else alert('Gunakan menu browser → Install app / Add to Home Screen.');};
</script></body></html>
