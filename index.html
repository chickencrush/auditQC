<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071a33"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="CC QC"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/icon-192.png"><title>Chicken Crush QC V3.1</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071a33;font-family:Inter,system-ui,Arial}.top{height:44px;background:#071a33;color:#eaf0fa;display:flex;align-items:center;padding:0 12px;gap:9px;font-size:12px;border-bottom:1px solid #ffffff18}.dot{width:8px;height:8px;border-radius:50%;background:#38c172}.dot.off{background:#ef4444}.brand{font-weight:700}.ver{opacity:.65}.spacer{flex:1}.install{border:1px solid #ffffff30;background:#ed1c24;color:white;border-radius:10px;padding:7px 11px;font-weight:800;cursor:pointer}.install[disabled]{opacity:.55;cursor:default}#main{position:fixed;left:0;right:0;top:44px;bottom:0;overflow:hidden;background:#071a33}.frame{display:block;border:0;width:100%;height:100%;background:#fff}.setup{width:100%;height:100%;display:grid;place-items:center;color:white;padding:24px}.card{max-width:650px;background:#102642;border:1px solid #ffffff20;border-radius:18px;padding:26px;box-shadow:0 20px 60px #0006}.card code{display:block;background:#061324;padding:12px;border-radius:10px;overflow-wrap:anywhere;color:#ffd0d5}.toast{position:fixed;z-index:99;left:50%;bottom:20px;transform:translate(-50%,20px);background:#101827;color:#fff;border:1px solid #ffffff24;border-radius:12px;padding:12px 16px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){.top{height:48px}.brand{font-size:11px}.ver{display:none}#main{top:48px}.install{padding:7px 9px;font-size:11px}}
</style></head><body><header class="top"><span id="dot" class="dot"></span><span id="net">Online</span><span class="brand">Chicken Crush QC</span><span class="ver">Production V3.1</span><span class="spacer"></span><button id="installBtn" class="install">⬇ Install Aplikasi</button></header><main id="main"></main><div id="toast" class="toast"></div><script src="config.js"></script><script>
const cfg=window.CCQC_CONFIG||{},main=document.getElementById('main'),btn=document.getElementById('installBtn'),toast=document.getElementById('toast');let deferredPrompt=null;
function say(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3200)}
function net(){const on=navigator.onLine;document.getElementById('dot').className='dot'+(on?'':' off');document.getElementById('net').textContent=on?'Online':'Offline'}addEventListener('online',net);addEventListener('offline',net);net();
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;if(standalone){btn.textContent='✓ Aplikasi Terpasang';btn.disabled=true}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;btn.hidden=false});addEventListener('appinstalled',()=>{deferredPrompt=null;btn.textContent='✓ Aplikasi Terpasang';btn.disabled=true;say('Aplikasi berhasil dipasang.')});
btn.addEventListener('click',async()=>{if(standalone)return;const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);if(deferredPrompt){deferredPrompt.prompt();const r=await deferredPrompt.userChoice;if(r.outcome==='accepted')say('Instalasi dimulai.');deferredPrompt=null;return}if(ios){say('iPhone/iPad: buka menu Share Safari → Add to Home Screen.');return}say('Chrome/Edge: buka menu browser → Install Chicken Crush QC / Install app. Jika belum muncul, refresh halaman sekali.')});
if(!cfg.APP_URL||cfg.APP_URL.includes('PASTE_')){main.className='setup';main.innerHTML='<div class="card"><h2>Konfigurasi Production belum selesai</h2><p>Isi <b>APP_URL</b> di <b>config.js</b> dengan URL Apps Script <b>/exec</b> yang aktif.</p><code>APP_URL: https://script.google.com/macros/s/.../exec</code><p>Setelah commit, refresh GitHub Pages.</p></div>'}else{const f=document.createElement('iframe');f.className='frame';f.allow='camera; microphone; clipboard-read; clipboard-write';f.referrerPolicy='no-referrer-when-downgrade';f.src=cfg.APP_URL;f.title='Chicken Crush QC Audit';main.appendChild(f)}
if('serviceWorker'in navigator)addEventListener('load',async()=>{try{const reg=await navigator.serviceWorker.register('./service-worker.js');reg.update();}catch(e){}});
</script></body></html>
